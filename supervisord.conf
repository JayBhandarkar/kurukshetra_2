[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --protected-mode no --daemonize no
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fastapi]
directory=/app/src/backend_ai
command=python -m uvicorn main:app --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",REDIS_URL="redis://127.0.0.1:6379/0"

[program:celery]
directory=/app/src/backend_ai
command=python -m celery -A celery_app.celery_app worker --loglevel=info --concurrency=1
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",REDIS_URL="redis://127.0.0.1:6379/0"

[program:frontend]
directory=/app/src/frontend
command=npm start -- -p 3000 -H 0.0.0.0
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="3000",FASTAPI_URL="http://127.0.0.1:8000"
